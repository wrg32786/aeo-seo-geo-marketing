name: Expand v0.5 deterministic assets

on:
  push:
    branches:
      - feat/issue-5-v0.5-shelf-mapper

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-5-v0.5-shelf-mapper

      - name: Verify and expand the staged bundle
        run: |
          cat .v050/part-* > /tmp/v050-assets.b64
          echo "99f0f1b4e432a7ee6df3cd9ea7bab824bfa488344d1e13a4fba6f59a2ddcd6a9  /tmp/v050-assets.b64" | sha256sum -c -
          base64 --decode /tmp/v050-assets.b64 > /tmp/v050-assets.tgz
          echo "521a065f7813f433b848dfa363aca393d86a251ca22936b59a081ca62053f280  /tmp/v050-assets.tgz" | sha256sum -c -
          tar -xzf /tmp/v050-assets.tgz
          rm -rf .v050 .github/workflows/expand-v050.yml

      - name: Commit expanded assets and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add v0.5 shelf mapper, schemas, fixture, and tests"
          git push origin HEAD:feat/issue-5-v0.5-shelf-mapper
