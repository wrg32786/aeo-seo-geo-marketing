name: Patch Python 3.11 compatibility

on:
  push:
    branches:
      - feat/issue-3-v0.4-auditor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-3-v0.4-auditor
      - name: Replace the Python 3.13-only f-string expression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/od_audit.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          replacement = r'''    for row in audit["findings"]:
                  detail = row["detail"].replace("|", "\\|")
                  lines.append(f"| {row['id']} | {row['priority']} | {row['stage']} | **{row['title']}** — {detail} |")'''.splitlines()
          output = []
          replaced = False
          for line in lines:
              if 'for row in audit["findings"]: lines.append(' in line:
                  output.extend(replacement)
                  replaced = True
              else:
                  output.append(line)
          if not replaced:
              raise SystemExit("compatibility line was not found")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/od_audit.py
          git commit -m "Fix Python 3.11 report rendering compatibility"
          git push origin HEAD:feat/issue-3-v0.4-auditor
