name: Publish v0.5.0 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release candidate
        run: |
          python scripts/validate_skill.py
          python -m unittest discover -s tests -v
      - name: Remove one-shot workflows and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-v050.yml
          rm -f .github/workflows/publish-v050-on-push.yml
          git add -A
          git commit -m "Remove one-shot v0.5.0 release workflows"
          git push origin HEAD:main
          release_sha=$(git rev-parse HEAD)
          if ! gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.5.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$release_sha" \
              --title "Organic Discovery v0.5.0 — Business Truth and AI Shelf Mapper" \
              --notes-file .release/v0.5.0.md
          fi
