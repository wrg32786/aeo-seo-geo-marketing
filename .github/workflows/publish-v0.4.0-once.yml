name: Publish v0.4.0 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.0-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if missing
        env:
          RELEASE_COMMIT: f48edb93eff0027007303eaca0af46ea7ae24f46
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.4.0 "$RELEASE_COMMIT" -m "Organic Discovery v0.4.0"
            git push origin refs/tags/v0.4.0
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 release already exists"
          else
            gh release create v0.4.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Organic Discovery v0.4.0 — Deterministic Auditor" \
              --notes "First executable Organic Discovery release. Adds a standard-library webpage auditor for public HTTP(S) URLs and local HTML; bounded SSRF-safe fetching; deterministic SEO/AEO/GEO findings; eight-stage status with unknown preservation; work orders with acceptance and rollback; an intentionally broken offline fixture; and CI on Python 3.11 and 3.13.\n\nRun:\n\n\`\`\`bash\npython scripts/od.py audit https://example.com --output output/\npython scripts/od.py audit ./page.html --output output/\n\`\`\`\n\nExplicitly excluded: dashboards, databases, scheduled AI tracking, CMS publishing, and autonomous community posting."
          fi
