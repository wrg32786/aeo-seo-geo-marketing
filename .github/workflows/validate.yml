name: Validate Organic Discovery

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package and committed examples
        run: python scripts/validate_skill.py

      - name: Run focused unit tests
        run: python -m unittest discover -s tests -v

      - name: Run offline auditor example
        run: |
          rm -rf /tmp/organic-discovery-example
          python scripts/od.py audit examples/sample-site/site/index.html --output /tmp/organic-discovery-example
          cmp /tmp/organic-discovery-example/audit.json examples/sample-site/expected/audit.json
          cmp /tmp/organic-discovery-example/work-orders.json examples/sample-site/expected/work-orders.json
          cmp /tmp/organic-discovery-example/report.md examples/sample-site/expected/report.md

      - name: Run Business Truth and AI Shelf example
        run: |
          rm -rf /tmp/organic-discovery-shelf
          mkdir -p /tmp/organic-discovery-shelf
          python scripts/od.py facts validate examples/sample-shelf/fact-registry.csv \
            --output /tmp/organic-discovery-shelf/facts.json
          python scripts/od.py shelf map examples/sample-shelf/observations.jsonl \
            --facts examples/sample-shelf/fact-registry.csv \
            --output /tmp/organic-discovery-shelf
          python scripts/od.py wedge plan /tmp/organic-discovery-shelf/shelf-map.json \
            --facts examples/sample-shelf/fact-registry.csv \
            --candidates examples/sample-shelf/candidates.json \
            --output /tmp/organic-discovery-shelf/wedge-plan.json
          cmp /tmp/organic-discovery-shelf/facts.json examples/sample-shelf/expected/facts.json
          cmp /tmp/organic-discovery-shelf/normalized-observations.jsonl examples/sample-shelf/expected/normalized-observations.jsonl
          cmp /tmp/organic-discovery-shelf/shelf-map.json examples/sample-shelf/expected/shelf-map.json
          cmp /tmp/organic-discovery-shelf/shelf-report.md examples/sample-shelf/expected/shelf-report.md
          cmp /tmp/organic-discovery-shelf/wedge-plan.json examples/sample-shelf/expected/wedge-plan.json
